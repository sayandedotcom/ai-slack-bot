name: Secret scan

on:
  workflow_call:
  schedule:
    # 04:17 UTC daily. A full-history scan catches a rule gitleaks only learned
    # AFTER a commit landed — the pull-request diff scan never revisits old
    # commits.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned AND checksummed. A version bump means changing both lines; the
  # checksum comes from that release's gitleaks_<version>_checksums.txt.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # FULL history. `gitleaks git` walks every commit, and a depth-1
          # checkout would scan one commit and report a clean tree — worse
          # than no scan, because it looks like a pass.
          fetch-depth: 0

      # The gitleaks BINARY, not gitleaks-action.
      #
      # The action is free only while a repository is owned by a user account;
      # an organisation needs a paid GITLEAKS_LICENSE. This repository is
      # described as the deliverable and may well move under an organisation,
      # at which point the action would start failing every run until someone
      # bought a licence. The binary is MIT and unaffected either way.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$url" -o /tmp/gitleaks.tgz
          # Hard failure on mismatch: this binary is about to read every
          # secret-shaped string in the repository.
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # ---- pull request: scan only what this PR introduces ------------------
      #
      # Fast, and always actionable: the commit is not on main yet.
      #
      # --redact is mandatory. Without it gitleaks prints the matched secret
      # into a CI log — the same discipline as check-text-files.mjs, which
      # reports path:line and deliberately never the content, "because its
      # output goes to CI logs".
      - name: Scan the pull request range
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact --no-banner --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif \
            .

      # ---- push, schedule, dispatch: scan ALL history -----------------------
      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: |
          gitleaks git \
            --redact --no-banner --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif \
            .

      # Also scan the WORKING TREE, not just commits.
      #
      # .dev.vars, apps/worker/sandbox/.build-secrets and *.env hold real
      # credentials and are gitignored — so `gitleaks git` cannot see them and
      # neither can a reviewer. This is the check that would catch one of them
      # being force-added. `gitleaks dir` reads the filesystem.
      - name: Scan the working tree
        run: |
          gitleaks dir \
            --redact --no-banner --exit-code 1 \
            .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 14
