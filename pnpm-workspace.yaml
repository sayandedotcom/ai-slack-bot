packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: false
  # lefthook's postinstall links the Go binary from its platform-specific
  # optionalDependency and installs the git hooks. `pnpm exec lefthook` works
  # without it, since its bin is a JS shim, but the root `prepare` script is
  # what actually guarantees the hooks exist after a clone.
  lefthook: true
