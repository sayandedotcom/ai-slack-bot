packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: false
  # No entry for husky: it ships no install lifecycle script at all. The git
  # hooks come from the root `prepare` script (`husky`), which pnpm 10 still
  # runs for the root project — only DEPENDENCY lifecycle scripts are gated
  # behind this allowBuilds list.
